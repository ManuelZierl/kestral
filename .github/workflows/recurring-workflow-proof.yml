name: Recurring workflow proof

on:
  pull_request:
    branches: [product/app-first-onboarding]

permissions:
  contents: read

concurrency:
  group: recurring-workflow-proof-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Node 22 + frontend + Rust
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: host/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Qualify Daily Review package
        working-directory: reference-apps/daily-review
        run: npm test

      - name: Install frontend toolchain
        working-directory: host
        run: npm ci

      - name: Frontend type-check
        working-directory: host
        run: npm run check

      - name: Frontend tests
        working-directory: host
        run: npm test -- --run

      - name: Rust formatting
        run: cargo fmt --all -- --check

      - name: Rust tests
        run: cargo test --all-features
