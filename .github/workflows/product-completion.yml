name: Product completion

on:
  pull_request:
    branches: [product/recurring-workflow-proof]

permissions:
  contents: read

concurrency:
  group: product-completion-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  creator-and-ui:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: host/package-lock.json

      - name: Test independently packageable app creator
        working-directory: packages/create-kestral-app
        run: |
          npm test
          npm pack --dry-run

      - name: Qualify Daily Review behavior
        working-directory: reference-apps/daily-review
        run: npm test

      - name: Install frontend toolchain
        working-directory: host
        run: npm ci

      - name: Frontend type-check
        working-directory: host
        run: npm run check

      - name: Frontend tests
        working-directory: host
        run: npm test -- --run
